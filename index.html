<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성경 발자국</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css">
<style>
  :root{
    --paper:#f7f1e6; --ink:#2b2219; --muted:#6f6253; --line:#e2d6c3;
    --sea:#cfe0ea; --land:#f3ead9; --border:#b9a78d; --accent:#b5651d;
    --card:#fffdf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans KR",system-ui,sans-serif;font-size:18px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  .app{display:flex;height:100%;}
  .panel{width:420px;flex:none;display:flex;flex-direction:column;background:var(--paper);
    border-right:1px solid var(--line);min-height:0}
  .brand{padding:16px 24px 10px;display:flex;align-items:baseline;gap:10px}
  .brand h1{margin:0;font-family:"Gowun Batang",serif;font-size:30px;font-weight:700;letter-spacing:-.5px}
  .brand span{color:var(--muted);font-size:15px}
  .journeys{padding:0 20px 14px;display:flex;flex-wrap:wrap;gap:8px}
  .jbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;
    padding:7px 13px;font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
  .jbtn i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .jbtn[aria-pressed="true"]{border-color:var(--jc);background:var(--jc);color:#fff}
  .jbtn[aria-pressed="true"] i{background:#fff !important}
  .scroll{flex:1;overflow:auto;padding:0 20px 16px;min-height:0}
  .jhead{padding:2px 4px 10px}
  .jhead h2{margin:0;font-family:"Gowun Batang",serif;font-size:22px}
  .jhead p{margin:4px 0 0;color:var(--muted);font-size:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;
    box-shadow:0 2px 10px rgba(80,60,30,.06)}
  .step{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:16px;font-weight:500}
  .num{width:38px;height:38px;border-radius:50%;background:var(--jc);color:#fff;display:grid;place-items:center;
    font-weight:900;font-size:18px}
  .pname{font-family:"Gowun Batang",serif;font-size:36px;font-weight:700;margin:12px 0 4px;line-height:1.25}
  .badge{display:inline-block;font-size:14px;font-weight:500;padding:3px 10px;border-radius:999px;
    background:#f2e4cf;color:#7a5523;margin-left:6px;vertical-align:middle;font-family:"Noto Sans KR"}
  .now{font-size:18px;color:#4a3f33;margin:0 0 14px;display:flex;gap:8px}
  .now b{flex:none;color:var(--jc);font-weight:700}
  .desc{font-size:19px;line-height:1.7;margin:0 0 16px}
  .ref{display:inline-block;font-size:18px;font-weight:700;color:var(--jc);border:1.5px solid var(--jc);
    border-radius:10px;padding:5px 12px}
  .dist{margin-top:14px;font-size:16px;color:var(--muted);line-height:1.6}
  .dist strong{color:var(--ink)}
  .list{margin:18px 0 0;padding:0;list-style:none}
  .list li button{width:100%;text-align:left;border:0;background:none;padding:9px 8px;border-radius:10px;
    display:flex;gap:12px;align-items:center;font-size:17px}
  .list li button:hover{background:#efe5d4}
  .list li button .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--jc);color:var(--jc);
    display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
  .list li button[aria-current="true"]{background:#efe5d4;font-weight:700}
  .list li button[aria-current="true"] .n{background:var(--jc);color:#fff}
  .nav{padding:14px 20px 12px;display:flex;gap:10px;border-top:1px solid var(--line);background:var(--paper)}
  .nav button{flex:1;border:0;border-radius:14px;padding:16px 10px;font-size:20px;font-weight:700}
  .prev{background:#e9dfcf}
  .next{background:var(--jc);color:#fff}
  .nav button:disabled{opacity:.35;cursor:default}
  .foot{padding:16px 4px 4px;font-size:12px;color:var(--muted);line-height:1.6}
  .foot a{color:inherit}
  .mapwrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0;background:var(--sea)}
  .tools{position:absolute;top:16px;right:16px;z-index:1000;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .tools button{border:1px solid var(--line);background:rgba(255,253,248,.96);border-radius:12px;padding:10px 14px;
    font-size:16px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .tools button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:1000;background:rgba(43,34,25,.92);
    color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;display:none;max-width:90%;text-align:center}
  /* 지도 위 글자 */
  .lbl{white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%);display:inline-block}
  .lbl.country{font-size:15px;font-weight:700;letter-spacing:3px;color:rgba(90,75,55,.55)}
  .lbl.sea{font-size:16px;font-style:italic;color:#4f7a96;font-family:"Gowun Batang",serif;font-weight:700}
  .lbl.lake{font-size:13px;color:#3f6f8e;font-family:"Gowun Batang",serif;font-weight:700}
  .lbl.river{font-size:13px;color:#4f7a96;font-family:"Gowun Batang",serif}
  .zlow .lbl.lake,.zlow .lbl.river{display:none}
  .sat .lbl.country{color:rgba(255,255,255,.8);text-shadow:0 1px 3px #000}
  .sat .lbl.sea,.sat .lbl.lake,.sat .lbl.river{color:#d9eefc;text-shadow:0 1px 3px #000}
  .pin{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--jc);color:var(--jc);
    display:grid;place-items:center;font-weight:900;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.25);
    transform:translate(-50%,-50%);transition:transform .2s}
  .pin.on{background:var(--jc);color:#fff;transform:translate(-50%,-50%) scale(1.3)}
  .pin.done{background:var(--jc);color:#fff;opacity:.85}
  .pinname{position:absolute;left:24px;top:-2px;white-space:nowrap;font-size:16px;font-weight:700;color:var(--ink);
    background:rgba(255,253,248,.9);padding:2px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.12);
    font-family:"Noto Sans KR"}
  .pinname{display:none}
  .pin.on .pinname,.pin:hover .pinname,.showall .pinname.first{display:block}
  .pin.on .pinname{font-size:19px;color:#fff;background:var(--jc);transform:scale(.77);transform-origin:left center}
  .leaflet-div-icon{background:none;border:0}
  .leaflet-container{font-family:"Noto Sans KR",sans-serif}
  .leaflet-control-attribution{font-size:11px}
  .leaflet-control-zoom a{width:44px !important;height:44px !important;line-height:44px !important;font-size:24px !important}
  /* 발표 모드 */
  body.present .panel{width:480px}
  body.present .pname{font-size:44px}
  body.present .desc{font-size:22px}
  /* 좁은 화면 */
  @media (max-width: 820px){
    .app{flex-direction:column-reverse}
    .panel{width:100%;height:52%;border-right:0;border-top:1px solid var(--line)}
    .mapwrap{flex:1}
    .brand{display:none}
    .journeys{padding:12px 14px 10px;flex-wrap:nowrap;overflow-x:auto}
    .jbtn{flex:none;font-size:16px}
    .scroll{padding:0 14px 10px}
    .pname{font-size:30px}
    .list{display:none}
    .jhead{display:none}
    .nav{padding:10px 14px}
    .foot{display:none}
    .tools{top:10px;right:10px}
    .tools button{padding:8px 11px;font-size:14px}
    .tools .fs{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="brand"><h1>성경 발자국</h1><span>말씀의 땅을 오늘의 지도 위에서</span></div>
    <div class="journeys" id="journeys" role="group" aria-label="여정 고르기"></div>
    <div class="scroll" id="scroll">
      <div class="jhead"><h2 id="jtitle"></h2><p id="jsub"></p></div>
      <article class="card" id="card" aria-live="polite"></article>
      <ol class="list" id="list"></ol>
  <div class="foot">
      거리는 두 곳 사이의 직선거리입니다. '위치 추정'은 학자마다 의견이 다른 곳입니다.<br>
      지도 자료: Natural Earth(퍼블릭 도메인) · 위성사진: Esri · 성경: 개역개정 표기<br>
      만든 사람 촌놈루니 · 피드백 bear4jesus@gmail.com
    </div>
    </div>
    <div class="nav">
      <button class="prev" id="prev">◀ 이전</button>
      <button class="next" id="next">다음 ▶</button>
    </div>

  </aside>
  <main class="mapwrap">
    <div id="map" aria-label="성경 지도"></div>
    <div class="tools">
      <button id="btnAll">전체 보기</button>
      <button id="btnSat" aria-pressed="false">위성사진</button>
      <button id="btnFs" class="fs">크게 보기</button>
    </div>
    <div class="toast" id="toast"></div>
  </main>
</div>

<script src="leaflet.js"></script>
<script src="basemap.js"></script>
<script src="journeys.js"></script>
<script>
(function(){
  const J = window.JOURNEYS, B = window.BASEMAP || {};
  const $ = id => document.getElementById(id);
  let jIndex = 0, sIndex = 0;

  // ---------- 지도 ----------
  const map = L.map('map', { zoomControl: true, attributionControl: true, minZoom: 3, maxZoom: 12,
    zoomSnap: 0.25, worldCopyJump: false, preferCanvas: true });
  map.attributionControl.setPrefix(false);
  map.createPane('labels'); map.getPane('labels').style.zIndex = 450; map.getPane('labels').style.pointerEvents='none';
  map.createPane('route'); map.getPane('route').style.zIndex = 420;

  const landStyle = { color: '#b9a78d', weight: 1, fillColor: '#f3ead9', fillOpacity: 1 };
  const landStyleSat = { color: 'rgba(255,255,255,.75)', weight: 1.2, fill: false };
  const land = B.land ? L.geoJSON(B.land, { style: landStyle, interactive: false }).addTo(map) : null;
  const lakes = B.lakes ? L.geoJSON(B.lakes, { style: { color:'#9fbfd3', weight:1, fillColor:'#cfe0ea', fillOpacity:1 }, interactive:false }).addTo(map) : null;
  const rivers = B.rivers ? L.geoJSON(B.rivers, { style: { color:'#8fb4cc', weight:1.6 }, interactive:false }).addTo(map) : null;
  const bStyle = { color:'#a8957a', weight:1.2, dashArray:'4 4', opacity:.9 };
  const borders = B.borders ? L.geoJSON(B.borders, { style: bStyle, interactive:false }).addTo(map) : null;
  map.setMaxBounds([[11, 4], [49.5, 62]]);
  map.attributionControl.addAttribution('지도: Natural Earth');

  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 17, attribution: '위성사진: Esri, Maxar, Earthstar Geographics' });
  let satOn = false, satFailed = false, satLoaded = false;
  sat.on('tileload', () => { satLoaded = true; });
  sat.on('tileerror', () => {
    if (satLoaded || satFailed) return;
    satFailed = true; setSat(false);
    toast('여기서는 위성사진을 불러올 수 없습니다. 인터넷 연결을 확인해 주세요.');
  });
  function setSat(on){
    satOn = on;
    $('btnSat').setAttribute('aria-pressed', on);
    document.body.classList.toggle('sat', on);
    borders && borders.setStyle(on ? { color:'rgba(255,255,255,.8)', weight:1.4, dashArray:'4 4' } : bStyle);
    if (on){ sat.addTo(map); land && land.setStyle(landStyleSat); lakes && lakes.setStyle({fill:false,color:'rgba(255,255,255,.6)'}); rivers && map.removeLayer(rivers); }
    else { map.removeLayer(sat); land && land.setStyle(landStyle); lakes && lakes.setStyle({ color:'#9fbfd3', weight:1, fillColor:'#cfe0ea', fillOpacity:1, fill:true }); rivers && rivers.addTo(map); }
  }

  // 우리말 지명(나라·바다·강)
  (window.MAP_LABELS||[]).forEach(l => {
    L.marker([l.lat, l.lng], { pane:'labels', interactive:false,
      icon: L.divIcon({ className:'', html:`<span class="lbl ${l.k}">${l.t}</span>`, iconSize:[0,0] }) }).addTo(map);
  });

  // ---------- 여정 ----------
  let routeLayer = L.layerGroup().addTo(map);
  let pins = [];

  function km(a, b){
    const R = 6371, r = Math.PI/180;
    const dLat = (b.lat-a.lat)*r, dLng = (b.lng-a.lng)*r;
    const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  const fmt = n => n < 10 ? n.toFixed(1) : Math.round(n).toLocaleString('ko-KR');

  function buildJourneyButtons(){
    $('journeys').innerHTML = J.map((j,i) =>
      `<button class="jbtn" style="--jc:${j.color}" data-i="${i}" aria-pressed="false"><i style="background:${j.color}"></i>${j.title}</button>`).join('');
    $('journeys').onclick = e => { const b = e.target.closest('.jbtn'); if (b) selectJourney(+b.dataset.i, 0, true); };
  }

  function selectJourney(i, s, fit){
    jIndex = i; const j = J[i];
    document.documentElement.style.setProperty('--jc', j.color);
    document.querySelectorAll('.jbtn').forEach((b,k) => b.setAttribute('aria-pressed', k===i));
    $('jtitle').textContent = j.title;
    $('jsub').textContent = `${j.sub} · ${j.ref}`;
    try { if (location.hash.slice(1) !== j.id) history.replaceState(null, '', '#'+j.id); } catch(e){}

    routeLayer.clearLayers(); pins = [];
    const pts = j.stops.map(s => [s.lat, s.lng]);
    j._full = L.polyline(pts, { pane:'route', color:j.color, weight:3, opacity:.45, dashArray:'6 8' }).addTo(routeLayer);
    j._done = L.polyline([], { pane:'route', color:j.color, weight:5, opacity:.95 }).addTo(routeLayer);

    const seen = {};
    j.stops.forEach((st, k) => {
      const key = st.lat.toFixed(3)+','+st.lng.toFixed(3);
      const first = !(key in seen); if (first) seen[key] = k;
      const m = L.marker([st.lat, st.lng], { keyboard:false,
        icon: L.divIcon({ className:'', iconSize:[0,0],
          html:`<div class="pin" style="--jc:${j.color}">${k+1}<span class="pinname${first?' first':''}">${st.name}</span></div>` }) })
        .on('click', () => go(k)).addTo(routeLayer);
      m._first = first; m._origin = seen[key];
      pins.push(m);
    });

    $('list').innerHTML = j.stops.map((st,k) =>
      `<li><button data-k="${k}"><span class="n">${k+1}</span>${st.name}</button></li>`).join('');
    $('list').onclick = e => { const b = e.target.closest('button'); if (b) go(+b.dataset.k); };

    if (fit) showAll();
    go(s || 0, !fit);
  }

  function showAll(){
    const j = J[jIndex];
    $('map').classList.add('showall');
    map.flyToBounds(L.latLngBounds(j.stops.map(s=>[s.lat,s.lng])), { padding:[70,70], duration:.8, maxZoom: 9 });
  }

  function go(k, move = true){
    const j = J[jIndex], st = j.stops[k]; sIndex = k;
    const prevSt = k > 0 ? j.stops[k-1] : null;
    let total = 0; for (let x=1; x<=k; x++) total += km(j.stops[x-1], j.stops[x]);

    $('card').innerHTML = `
      <div class="step"><span class="num">${k+1}</span> ${j.stops.length}곳 가운데 ${k+1}번째</div>
      <div class="pname">${st.name}${st.guess?'<span class="badge">위치 추정</span>':''}</div>
      <p class="now"><b>지금은</b><span>${st.now}</span></p>
      <p class="desc">${st.desc}</p>
      <span class="ref">${st.ref}</span>
      <div class="dist">${prevSt
        ? `${prevSt.name}에서 약 <strong>${fmt(km(prevSt, st))}km</strong><br>출발지부터 지금까지 약 <strong>${fmt(total)}km</strong>`
        : '여정의 출발점입니다.'}</div>`;

    pins.forEach((m,x) => {
      const el = m.getElement() && m.getElement().querySelector('.pin'); if (!el) return;
      el.classList.toggle('on', x===k); el.classList.toggle('done', x<k);
      m.setZIndexOffset(x===k ? 1000 : (x===pins[k]._origin ? 900 : 0));
      // 같은 곳을 다시 지날 때는 처음 표시한 핀이 강조됨
    });
    j._done.setLatLngs(j.stops.slice(0, k+1).map(s=>[s.lat,s.lng]));

    document.querySelectorAll('#list button').forEach((b,x) => b.setAttribute('aria-current', x===k));
    $('prev').disabled = k===0; $('next').disabled = k===j.stops.length-1;
    $('next').textContent = k===j.stops.length-1 ? '여정 끝' : '다음 ▶';

    if (move){
      $('map').classList.remove('showall');
      if (prevSt) map.flyToBounds(L.latLngBounds([[prevSt.lat,prevSt.lng],[st.lat,st.lng]]), { padding:[110,110], maxZoom: zoomFor(j,k), duration: 1 });
      else map.flyTo([st.lat, st.lng], zoomFor(j,k), { duration: 1 });
    }
  }
  function zoomFor(j, k){ return (j.id==='jesus') ? 9.5 : 7; }

  $('prev').onclick = () => sIndex>0 && go(sIndex-1);
  $('next').onclick = () => sIndex<J[jIndex].stops.length-1 && go(sIndex+1);
  $('btnAll').onclick = showAll;
  $('btnSat').onclick = () => { if (satFailed){ toast('여기서는 위성사진을 불러올 수 없습니다. 인터넷 연결을 확인해 주세요.'); return; } setSat(!satOn); };
  $('btnFs').onclick = async () => {
    try {
      if (!document.fullscreenElement){ await document.documentElement.requestFullscreen(); document.body.classList.add('present'); $('btnFs').textContent='작게 보기'; }
      else { await document.exitFullscreen(); }
    } catch(e){ document.body.classList.toggle('present'); }
    setTimeout(()=>map.invalidateSize(), 300);
  };
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement){ document.body.classList.remove('present'); $('btnFs').textContent='크게 보기'; setTimeout(()=>map.invalidateSize(),300);} });
  document.addEventListener('keydown', e => {
    if (e.key==='ArrowRight' || e.key==='PageDown' || e.key===' ') { e.preventDefault(); $('next').click(); }
    if (e.key==='ArrowLeft' || e.key==='PageUp') { e.preventDefault(); $('prev').click(); }
  });

  function zcls(){ $('map').classList.toggle('zlow', map.getZoom() < 7); }
  map.on('zoomend', zcls);
  let tt; function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(tt); tt=setTimeout(()=>t.style.display='none', 3500); }

  buildJourneyButtons();
  const fromHash = J.findIndex(j => j.id === location.hash.slice(1));
  map.setView([34, 30], 4);
  selectJourney(fromHash >= 0 ? fromHash : 0, 0, true);
  window.addEventListener('hashchange', () => { const i = J.findIndex(j => j.id === location.hash.slice(1)); if (i>=0 && i!==jIndex) selectJourney(i,0,true); });
})();
</script>
</body>
</html>
